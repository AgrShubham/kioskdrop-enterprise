services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kioskdrop-enterprise:latest
    container_name: kioskdrop_enterprise
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - SERVER_PIN_PEPPER=kioskdrop-secret-pepper-2026-production-entropy
      - SESSION_SECRET=kioskdrop-session-secret-key-32charsmin-abc123
      - WEBHOOK_SIGNING_SECRET=kioskdrop-webhook-hmac-sha256-signing-secret
      - RESERVATION_TTL_MINUTES=10
      - RETURN_DUE_HOURS=4
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - kioskdrop_db:/app/prisma

volumes:
  kioskdrop_db:
    name: kioskdrop_enterprise_db
